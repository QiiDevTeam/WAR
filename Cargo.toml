[workspace]
members = [
    "crates/war-protocol",
    "crates/war-core",
    "crates/war-semantic",
    "crates/war-win32",
    "crates/war-uia",
    "crates/war-runtime",
    "crates/war-mcp",
    "crates/war-cli",
    "tests/fixture-win32",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "=1.0.89"
bitflags = { version = "=2.6.0", features = ["serde"] }
clap = { version = "=4.5.20", features = ["derive"] }
crossbeam-channel = "=0.5.11"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
thiserror = "=1.0.64"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "=0.61.2"

[profile.release]
lto = "thin"
strip = "symbols"
